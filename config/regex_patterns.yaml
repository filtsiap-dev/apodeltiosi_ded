afm:
  prefix: '(?:Α\.?Φ\.?Μ\.?|AFM)\s*[:.]?\s*'
  body: '(\d{9})'
amka:
  prefix: '(?:ΑΜΚΑ|AMKA)\s*[:.]?\s*'
  body: '(\d{11})'
iban:
  body: '[A-Z]{2}\d{2}(?:[\s-]?[A-Z0-9]){1,30}'
email:
  body: '[\w.+-]+@[\w-]+\.[\w.-]+'
date_numeric:
  body: '\b\d{1,2}[/\-\.]\d{1,2}[/\-\.]\d{4}\b'
money:
  body: '(?:€\s*)?\d{1,3}(?:\.\d{3})*,\d{2}(?:\s*(?:€|ευρώ))?'
protocol_number:
  prefix: '(?:αριθμ[οό]\s+πρωτοκόλλου|αριθ\.?\s*πρωτ\.?|αρ\.?\s*πρωτ\.?|Πρωτ\.?)\s*[:.]?\s*'
  body: '([A-Za-z0-9Α-Ωα-ωΆ-ώ/\-]*\d[A-Za-z0-9Α-Ωα-ωΆ-ώ/\-]*(?:/\d{2,4})?)'
audit_order:
  prefix: '(?:εντολ[ήέ]ς?\s+(?:μερικού\s+)?ελέγχου|Γνωστοποίησ(?:η|εις)|Αίτημ(?:α|ατα)\s+Παροχής\s+Πληροφοριών|Πρόσκλησ(?:η|εις)|Πληροφοριακή\s+Έκθεση|ΑΒΜ|ΕΞ)\s+'
  body: '([0-9]{2,}(?:\s*[/&]\s*[0-9]+)*(?:[/\-]\d{2,4}(?:[/\-.]\d{2,4})*)?)'
