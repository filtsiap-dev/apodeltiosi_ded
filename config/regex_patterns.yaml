afm:
  prefix: '(?:Α\.?Φ\.?Μ\.?|AFM)\s*(?:[:.]\s*)?'
  body: '(\d{9})'
amka:
  prefix: '(?:ΑΜΚΑ|AMKA)\s*(?:[:.]\s*)?'
  body: '(\d{11})'
iban:
  body: '[A-Z]{2}\d{2}(?:[\s-]?[A-Z0-9]){1,30}'
email:
  body: '[\w.+-]{1,64}@[\w-]{1,253}\.[\w.-]{1,253}'
date_numeric:
  body: '\b\d{1,2}[/\-\.]\d{1,2}[/\-\.]\d{4}\b'
money:
  # A Greek-format amount, whole even with a thousands point missing ("7.755,82", "1.687225,93 €", a sign
  # attached: "-199.414,33", "€ 6.496,43"); a whole amount only with its currency ("5.000 ευρώ", "5000 €");
  # an English-format amount ("10,501.68"). Never digits inside a longer number (no digit, point or comma
  # right before it, no digit right after it): not "019,20" of "2019,2020", not "0,00" of a rate "0,0037".
  body: '(?<![\p{N}.,])(?:-\s?)?(?:€\s*)?\d(?:[\d.]{0,14}\d)?,\d{2}(?![\p{N}])(?:\s*(?:€|ευρώ))?|(?<![\p{N}.,])(?:\d{1,3}(?:\.\d{3})+|\d{1,7})(?:,\d{1,2})?\s*(?:€|ευρώ)|(?<![\p{N}.,])\d{1,3}(?:,\d{3})+\.\d{2}(?![\p{N}])'
protocol_number:
  prefix: '(?:αριθμ[οό]\s+πρωτοκόλλου|αριθ\.?\s*πρωτ\.?|αρ\.?\s*πρωτ\.?|Πρωτ\.?)\s*(?:[:.]\s*)?'
  body: '([A-Za-z0-9Α-Ωα-ωΆ-ώ/\-]*\d[A-Za-z0-9Α-Ωα-ωΆ-ώ/\-]*(?:/\d{2,4})?)'
audit_order:
  prefix: '(?:εντολ[ήέ]ς?\s+(?:μερικού\s+)?ελέγχου|Γνωστοποίησ(?:η|εις)|Αίτημ(?:α|ατα)\s+Παροχής\s+Πληροφοριών|Πρόσκλησ(?:η|εις)|Πληροφοριακή\s+Έκθεση|ΑΒΜ|ΕΞ)\s+'
  body: '([0-9]{2,}(?:\s*[/&]\s*[0-9]+)*(?:[/\-]\d{2,4}(?:[/\-.]\d{2,4})*)?)'

# ---------------------------------------------------------------------------
# HARD PRESERVE phrase families: the ONE definition of each (there is no Java
# copy). Every family names an existing hard_preserve_categories entry of
# policy.yaml (a family naming any other category, or an unknown one, is
# DISABLED with a warning at startup and never used; a malformed family is
# still refused) and a scope:
#   any    the phrase wherever it stands, as whole words;
#   label  only as a label: alone on its line (a heading, a table cell; list
#          numbering, quotes and closing punctuation allowed), or first on its
#          line before a colon (a label-value cell).
# Patterns are written FOLDED: lowercase, unaccented, σ for every sigma. The
# text is folded code point by code point (same length, so the same
# coordinates); a decomposed accent may follow any letter, and each written
# space matches 1 to 3 whitespace characters. Every alternative is a closed
# phrase: nothing here consumes arbitrary following text. A pattern may have
# ONE capturing group, the VARIABLE part of a composite reference (a serial):
# it is left out of the preserve, for the existing rules and the LLM passes.
preserve_families:
  # State, DED and official-document headings.
  official_headings:
    category: FIELD_LABEL
    scope: any
    patterns:
      - 'ελληνικη δημοκρατια'
      - 'ακριβεσ αντιγραφο'
      - '(?:ο|η) προισταμεν(?:οσ|η) τ(?:ησ|ου) (?:διευθυνσησ|δ/νσησ) επιλυσησ διαφορων'
      - 'με εντολη του προισταμενου(?: τησ (?:διευθυνσησ|δ/νσησ) επιλυσησ διαφορων)?'
  decision_headings:
    category: FIELD_LABEL
    scope: label
    patterns:
      - 'αποφασιζουμε'
      - 'εχοντασ υποψη'
      - '(?:συντομο )?ιστορικο'
  ded_units:
    category: PUBLIC_SERVICE
    scope: any
    patterns:
      - '(?:διευθυνσ(?:η|ησ|ην)|δ/νσ(?:η|ησ|ην)) επιλυσησ διαφορων'
      # "ΥΠΟΔΙΕΘΥΝΣΗ" (the υ left out) occurs in the source decisions.
      - '(?:υποδιευ?θυνσ(?:η|ησ|ην)|υποδ/νσ(?:η|ησ|ην)) επανεξετασησ'
      - 'τμημα(?:τοσ)? εξυπηρετησησ(?: φορολογουμενων)?'
      - 'τμημα(?:τοσ)? επανεξετασησ(?: [α-ω]\d{1,2})?'
      - 'τμημα(?:τοσ)? [α-ω]\d{1,2}'
      - '(?:αυτοτελ(?:εσ|ουσ) )?τμημα(?:τοσ)? διοικητικησ υποστηριξησ'
  # Public institutions and authorities; a place only where it is part of the
  # institution's own name (the regions of Greece, a closed set).
  public_bodies:
    category: PUBLIC_SERVICE
    scope: any
    patterns:
      - 'ανεξαρτητ(?:η|ησ|ην) αρχ(?:η|ησ|ην) δημοσιων εσοδων'
      - 'γενικ(?:η|ησ|ην) γραμματει(?:α|ασ) δημοσιων εσοδων'
      - 'υπουργει(?:ο|ου) (?:οικονομικων|εθνικησ οικονομιασ και οικονομικων|δικαιοσυνησ|εσωτερικων|παιδειασ|υγειασ|εργασιασ|αναπτυξησ|περιβαλλοντοσ|υποδομων|αγροτικησ αναπτυξησ|πολιτισμου|τουρισμου|ψηφιακησ διακυβερνησησ)'
      - 'φορολογικ(?:η|ησ|ην) διοικησ(?:η|ησ|ην)'
      - 'δημοσι(?:α|ασ|αν) διοικησ(?:η|ησ|ην)'
      - 'γενικ(?:η|ησ|ην) κυβερνησ(?:η|ησ|ην)'
      - 'ελληνικ(?:ο|ου) δημοσι(?:ο|ου)'
      - 'ελεγκτικ(?:ο|ου|α|ων) κεντρ(?:ο|ου|α|ων)'
      - 'φορολογικ(?:η|ησ|ην) αρχ(?:η|ησ|ην)'
      - 'διοικητικ(?:η|ησ|ην) δικαιοσυν(?:η|ησ|ην)'
      - 'ομοσπονδ(?:ιακ(?:η|ησ|ην)|ου) δημοκρατι(?:α|ασ)(?: τησ γερμανιασ)?'
      - '(?:γερμανικ(?:οι|ουσ|ων) )?(?:δημοσι(?:οι|ουσ|ων) )?ασφαλιστικ(?:οσ|ου|ο|οι|ουσ|ων) φορε(?:ασ|α|ισ|ων)'
      - 'προεδρ(?:οσ|ου|ο) πρωτοδικων'
      - 'υπουργ(?:οσ|ου|ο) (?:οικονομικων|εθνικησ οικονομιασ και οικονομικων)'
      - 'διοικητ(?:ησ|η) (?:τησ )?(?:α\.? ?α\.? ?δ\.? ?ε\.?)'
      - 'ταμει(?:ο|ου) παρακαταθηκων(?: και δανειων)?'
      - 'δημοτικ(?:η|ησ|ην) αρχ(?:η|ησ|ην)'
      - 'ασφαλιστικ(?:οσ|ου|ο|οι|ουσ|ων) οργανισμ(?:οσ|ου|ο|οι|ουσ|ων)'
      - 'δημοσι(?:α|ασ|εσ|ων) οικονομικ(?:η|ησ|εσ|ων)(?: υπηρεσι(?:α|ασ|εσ|ων))?'
      - 'οργανισμ(?:οσ|ου|ο|οι|ων|ουσ) τοπικησ αυτοδιοικησησ'
      - 'περιφερει(?:α|ασ|αν) (?:αττικησ|κεντρικησ μακεδονιασ|δυτικησ μακεδονιασ|ανατολικησ μακεδονιασ και θρακησ|ηπειρου|θεσσαλιασ|ιονιων νησων|δυτικησ ελλαδασ|στερεασ ελλαδασ|πελοποννησου|βορειου αιγαιου|νοτιου αιγαιου|κρητησ)'
      - '(?:(?:τριμελ|μονομελ)(?:εσ|ουσ) )?διοικητικ(?:ο|ου) (?:πρωτοδικει(?:ο|ου)|εφετει(?:ο|ου))'
      - 'διοικητικων δικαστηριων'
      - 'συμβουλι(?:ο|ου) τησ επικρατειασ'
      - 'κε\.? ?φο\.? ?δ\.? ?ε\.?(?: (?:αττικησ|θεσσαλονικησ))?'
      - 'κε\.? ?φο\.? ?κ\.?(?: (?:αττικησ|θεσσαλονικησ))?'
      - 'κε\.? ?β\.? ?εισ\.?(?: (?:αττικησ|θεσσαλονικησ))?'
      - 'ελ\.? ?κε\.?(?: (?:αττικησ|θεσσαλονικησ))?'
      - 'υ\.? ?ε\.? ?δ\.? ?δ\.? ?ε\.?(?: (?:αττικησ|θεσσαλονικησ))?'
      - 'υδομ'
      - 'δ\.ο\.υ\.?|δου'
  administrative_departments:
    category: PUBLIC_SERVICE
    scope: any
    patterns:
      - 'τμημα(?:τοσ)? πολεοδομικων εφαρμογων'
      - '(?:διευθυνσ(?:η|ησ|ην)|δ/νσ(?:η|ησ|ην)) (?:υδομ|υπηρεσιασ δομησησ)'
      - 'υπηρεσι(?:α|ασ) δομησησ'
      - 'τμημα(?:τοσ)? χωρικου σχεδιασμου'
      - '(?:διευθυνσ(?:η|ησ|ην)|δ/νσ(?:η|ησ|ην)) περιβαλλοντοσ και χωρικου σχεδιασμου'
      - '(?:διευθυνσ(?:η|ησ|ην)|δ/νσ(?:η|ησ|ην)) ηλεκτρονικησ διακυβερνησησ'
      - '(?:διευθυνσ(?:η|ησ|ην)|δ/νσ(?:η|ησ|ην)) πολεοδομικου σχεδιασμου'
      - '(?:διευθυνσ(?:η|ησ|ην)|δ/νσ(?:η|ησ|ην)) εφαρμογησ φορολογιασ κεφαλαιου'
  # Legal, tax and statutory terminology (the words, never a number).
  legal_terms:
    category: LEGAL_REF
    scope: any
    patterns:
      - 'κωδικ(?:ασ|α) φορολογικησ διαδικασιασ'
      - 'κωδικ(?:ασ|α) φορολογιασ εισοδηματοσ'
      - 'κωδικ(?:ασ|α) διοικητικησ (?:δικονομιασ|διαδικασιασ)'
      - 'πρωτ(?:ο|ου) προσθετ(?:ο|ου) πρωτοκολλ(?:ο|ου)'
      - 'ενιαι(?:οσ|ου|ο) φορ(?:οσ|ου|ο) ιδιοκτησιασ ακινητ(?:ων|ησ περιουσιασ|ησ)'
      - '(?:φορολογι(?:α|ασ)|φορ(?:οσ|ου|ο)|προστιμ(?:ο|ου)) εισοδηματοσ'
      - 'φορολογι(?:α|ασ)'
      - 'αλληλεγγυ(?:α|ασ|η|ησ) ευθυν(?:η|ησ)'
      - 'φορ(?:οσ|ου|ο) προστιθεμενησ αξιασ'
      - 'γνωμοδοτησ(?:η|ησ|ην|εισ|εων)'
      - 'ποινικ(?:ο|ου) μητρω(?:ο|ου)'
      - 'σ\.? ?α\.? ?δ\.? ?φ\.?(?: ελλαδασ(?: ?-? ?γερμανιασ)?)?'
      - 'κωδικ(?:ασ|α) βιβλιων(?: και στοιχειων)?'
      - 'εγχειριδι(?:ο|ου) διοικητικου δικαιου'
      - '(?:τ(?:ησ|ην|η) )?πολ\.?'
      - '(?:φυσικ|νομικ)(?:ο|ου|α|ων) προσωπ(?:ο|ου|α|ων)'
      - '(?:ο\.? ?π\.? ?σ\.? )?περιουσιολογι(?:ο|ου)'
      - 'εν\.? ?φ\.? ?ι\.? ?α\.?'
  # Procedural terms: the term only; the number of a particular act is left out.
  procedural_terms:
    category: FIELD_LABEL
    scope: any
    patterns:
      - 'οριστικ(?:η|ησ|ην|εσ|ων) πραξ(?:η|ησ|ην|εισ|εων|εωσ)'
      - 'αιτημ(?:α|ατα|ατοσ|ατων) παροχησ πληροφοριων'
      - 'πληροφοριακ(?:η|ησ|ην|εσ|ων) εκθεσ(?:η|ησ|ην|εισ|εων)(?: ελεγχου)?'
      - 'προσβαλλομεν(?:η|ησ|ην|εσ|ων) πραξ(?:η|ησ|ην|εισ|εων)'
      - '(?:προσωριν(?:οσ|ου|ο) )?(?:διορθωτικ|διοικητικ)(?:οσ|ου|ο) προσδιορισμ(?:οσ|ου|ο)(?: φορου)?'
      - 'προσδιορισμ(?:οσ|ου|ο) φορου'
      - 'επιβολ(?:η|ησ|ην) προστιμου(?: εισοδηματοσ)?'
      - 'αποφασ(?:η|ησ|ην|εισ|εων)'
      - 'σημειωμ(?:α|ατοσ|ατα|ατων) διαπιστωσεων'
      - 'εκθεσ(?:η|ησ|ην|εισ|εων) (?:μερικου |πληρουσ )?(?:φορολογικου )?ελεγχου'
      - 'εκθεσ(?:η|ησ|ην|εισ|εων) αποψεων'
      - 'εντολ(?:η|ησ|ην|εσ) (?:μερικου )?(?:φορολογικου )?ελεγχου'
      - 'πραξ(?:η|ησ|ην|εισ|εων|εωσ)'
      - 'σημειωμ(?:α|ατοσ) πληρωμησ'
  # Section headings, and complete expressions verified in the source
  # decisions (a fragment of one is protected only inside the whole).
  section_headings:
    category: FIELD_LABEL
    scope: any
    patterns:
      - 'γενικα στοιχεια'
      - 'συντομο ιστορικο'
      - 'γενικ(?:εσ|ων) διαταξε(?:ισ|ων)'
      - 'γενικ(?:εσ|ων) παρατηρησε(?:ισ|ων)'
      - 'τεχνικ(?:η|ησ) αναλυσ(?:η|ησ)'
      - 'αποψε(?:ισ|ων) ελεγχομενου'
      - 'δικαιωμα(?:τοσ)? ανταποδειξησ'
      - 'προσωποποιημεν(?:η|ησ|ην) πληροφορησ(?:η|ησ|ην)'
      - 'στοχοθεσια εμμεσων τεχνικων σε μη επιτηδευματιεσ'
      - 'εναλλακτικοσ τροποσ υπολογισμου τησ ελαχιστησ φορολογιασ'
      - 'μεθοδολογι(?:α|ασ) εμμεσων τεχνικων ελεγχου'
      - 'διαθεσιμ(?:α|ων) περιουσιακ(?:α|ων) στοιχει(?:α|ων)'
      - 'συνολικο δηλωθεν εισοδημα'
      - 'περιγραφη φορολογητεου εισοδηματοσ'
      - 'προσθετα ποσα εισοδηματοσ και λοιπα πληροφοριακα στοιχεια'
      - 'για τουσ λογουσ αυτουσ'
  # Financial terminology, table headings and calculation-column labels.
  financial_terms:
    category: FIELD_LABEL
    scope: any
    patterns:
      - 'πηγ(?:εσ|ων) κεφαλαι(?:ων|ου)'
      - 'αναλωσ(?:η|ησ|εισ|εων) κεφαλαι(?:ου|ων)'
      - 'πινακ(?:ασ|α|εσ|ων) αναλωσησ(?: κεφαλαιου)?'
      - 'ακαθαριστ(?:α|ων) εσοδ(?:α|ων)'
      - 'διαθεσιμ(?:ο|ου) εισοδημ(?:α|ατοσ)'
      - 'διαφορα διαθεσιμου(?: εισοδηματοσ)?'
      - 'λοιπ(?:εσ|ων) δαπαν(?:εσ|ων)'
      - 'δαπαν(?:εσ|ων) (?:δεκο|χρησησ)'
      - 'αποσβεσ(?:η|ησ) δανειων(?: πιστωτικων ιδρυματων)?'
      - 'τοκοχρεολυτικ(?:η|ησ) αποσβεσ(?:η|ησ)'
      - 'χορηγησ(?:η|ησ|εισ|εων) δανειων'
      - 'αναλυσ(?:η|ησ) ρευστοτητασ'
      - 'πινακ(?:ασ|α) ενεργητικου'
      - 'καθαρ(?:η|ησ) θεσ(?:η|ησ)'
      - 'στο (?:ενεργητικο|παθητικο)'
      - 'καθαρ(?:η|ησ) αξι(?:α|ασ)'
      - 'συνολικ(?:εσ|ων) εκρο(?:εσ|ων)'
      - 'καταλογιζομεν(?:ο|ου) ποσο'
      - 'πιστωτικ(?:ο|ου|α|ων) ιδρυμα(?:τοσ|τα|των)?'
      - 'πιστωσε(?:ισ|ων)'
      - 'φ\.? ?π\.? ?α\.?'
      - 'ποσο'
      - 'συνολο'
      - 'πιστωτικ(?:ο|ου) υπολοιπ(?:ο|ου)'
      # A column heading split over spaced lines, with its year ("ΠΙΣΤΩΣΕΙΣ ΦΟΡ/ΚΟΥ     ΕΤΟΥΣ 2019"); the
      # Latin "O" typed for an omicron occurs in the source.
      - 'πιστωσεισ φορ/κ[οo]υ\s{1,20}ετουσ(?: (?:19|20)[0-9]{2})?'
      - 'τροποσ εξοφλησησ(?: τησ αξιασ των ληφθεντων απο την ελεγχομενη φορολογικων στοιχειων(?: ?\(βασει προσκομισθεντων δικαιολογητικων\))?)?'
      - 'ταμειακ(?:η|ησ|ην|εσ|ων) φορολογικ(?:η|ησ|ην|εσ|ων) μηχαν(?:η|ησ|ην|εσ|ων)'
  property_tax_headings:
    category: FIELD_LABEL
    scope: any
    patterns:
      - '(?:φορολογικ|φορ/κ)(?:ο|ου) ετ(?:οσ|ουσ)'
      - 'φορολογικ(?:α|ων) ετ(?:η|ων)'
      - 'φορολογικ(?:η|ησ|ην) περιοδ(?:οσ|ου|ο)'
      - 'στοιχεια γηπεδων'
      - 'ειδικ(?:εσ|ων) συνθηκ(?:εσ|ων)'
      - 'ειδικ(?:η|ησ) κατηγορι(?:α|ασ)'
      - 'μοναδιαι(?:α|ασ) αξι(?:α|ασ)'
      - 'ημερομηνι(?:α|ασ) επεξεργασιασ'
  # Field, reference, bank, address and official-header labels: the label is
  # kept, the value after it stays with the existing redaction rules.
  reference_labels:
    category: FIELD_LABEL
    scope: any
    patterns:
      - '(?:α\.? ?φ\.? ?μ\.?|afm|ονοματεπωνυμο) (?:επιχειρησησ|μισθωτου|αντισυμβαλλομενου)'
      - 'ειδοσ συμμετοχησ'
      - 'λογαριασμ(?:οσ|ου|ο) αντισυμβαλλομενου'
      - 'αριθμ(?:οσ|ου|ο) (?:αναφορασ|πρωτοκολλου|ειδοποιησησ|φυλλου|λογαριασμου|αποφασησ|καταχωρισησ|φορολογικου μητρωου|λογ/σμου)'
      - 'αριθμ(?:οσ|ου|ο)'
      - 'αρ\. ?πρ(?:ωτ)?\.(?: αποστολεα)?'
      - 'αρ\. ?καταχωρισησ'
      - 'με αριθμο'
      - 'υπ[''’ʼ΄.] ?αρ(?:ιθμ)?\.?'
      - 'γ\.? ?ε\.? ?μη\.?'
      - 'ατβ'
      - 'πληρεξουσι(?:ο|ου|α)'
      - 'λογ\.'
      - 'λογαριασμ(?:οσ|ου|ο|οι|ων|ουσ)'
      - '(?:με|υπο) την επωνυμια'
      - 'με εδρα'
      - 'επι τησ'
      - 'ημερομηνι(?:α|ασ)'
  # Identity, property and contact cues, and "Τράπεζα", only where they stand
  # as a label (a header cell, "Τηλέφωνο:"): inside running text they can begin
  # or belong to a name ("Τράπεζα Χ" is a bank's name, "ΙΒΑΝ" a first name,
  # "Ιερά Οδός" a street), and the existing field_label rule already keeps a
  # cue that a value follows.
  identity_labels:
    category: FIELD_LABEL
    scope: label
    patterns:
      - 'α\.? ?φ\.? ?μ\.?|afm'
      - 'α\.? ?μ\.? ?κ\.? ?α\.?|amka'
      - 'iban'
      - 'α\.? ?τ\.? ?α\.? ?κ\.?'
      - 'κ\.? ?α\.? ?ε\.? ?κ\.?'
      - 'ο\. ?τ\.?'
      - 'α\.? ?χ\.? ?κ\.?'
      - 'τ\.? ?κ\.?'
      - 'τραπεζ(?:α|ασ)'
      - 'ταχ\. ?δ/νση|ταχ\. ?κωδικασ|τηλεφων(?:ο|ου)|τηλ\.|fax|φαξ|e-?mail'
  # Generic party roles and administrative roles: the role, never a name
  # after it (the final official signatory is detectFinalSignatory's).
  party_roles:
    category: FIELD_LABEL
    scope: any
    patterns:
      - '(?:η|τησ|την) (?:προσφευγουσ(?:α|ασ) |ελεγχομεν(?:η|ησ) )?(?:εταιρει|εταιρι|επιχειρησ)(?:α|ασ|η|ησ)'
      - '(?:ο|του|τον) προσφευγ(?:ων|οντοσ|οντα)'
      - '(?:η|τησ|την) προσφευγουσ(?:α|ασ)'
      - '(?:ο|του|τον) διαχειριστ(?:ησ|η)'
      - '(?:ο|του|τον) νομιμ(?:οσ|ου|ο) εκπροσωπ(?:οσ|ου|ο)'
      - '(?:οι|των|τουσ) νομιμ(?:οι|ων|ουσ) εκπροσωπ(?:οι|ων|ουσ)'
      - 'διευθυν(?:ων|οντοσ|οντα|οντεσ|οντων|ουσα|ουσασ) συμβουλ(?:οσ|ου|ο|οι|ων)'
      - 'τοπογραφ(?:οσ|ου|ο) μηχανικ(?:οσ|ου|ο)'
      - 'υποδιευθυντ(?:ησ|η|ρια|ριασ) ελεγχου'
      - 'γενικ(?:οσ|ου|ο) γραμματε(?:ασ|α) δημοσιων εσοδων'
      - 'προισταμεν(?:οσ|ου|ο|οι|ων|η|ησ|ην|εσ)(?: τ(?:ησ|ου))?'
      - 'διοικητικ(?:ο|ου) συμβουλι(?:ο|ου)'
      - '(?:[οo]/η|η/[οo]) υπαλληλοσ'
  # Composite references: the register code with its year ("ΕΞ 2026", "ΕΙ2024",
  # a letter O typed for a zero), a type code and the dated suffix; the
  # issuing-unit code of an ΕΛ.ΚΕ. reference; the "ΔΑ" code and date of a
  # SENDER'S protocol reference (never an invoice's "ΔΑ"). The serial, group
  # 1, is left out. No number is ever preserved for its value (no "/141", no
  # ATB or power-of-attorney serial).
  register_references:
    category: DECISION_METADATA
    scope: any
    patterns:
      - '(?:εξ|ει) ?(?:19|2[0οo])[0-9οo]{2}(?: εμπ)?(?: ?/ ?[0-9οo]{1,2}[-./][0-9οo]{1,2}[-./][0-9οo]{4})?'
      - 'ελ\.? ?κε\.? ?\d{1,2} ?ατ (\d+)'
      - '(?:αρ(?:ιθμ)?\.? ?πρ(?:ωτ)?\.?(?: αποστολεα)?|αριθμ(?:ο|οσ|ου) πρωτοκολλου) δα (\d+) ?/ ?[0-9οo]{1,2}[-./][0-9οo]{1,2}[-./][0-9οo]{4}'
  # A PUBLISHED administrative instrument, kept whole with its serial ("Δ. ΟΡΓ. Α 1125859 ΕΞ
  # 2020/23.10.2020 Απόφασης του Διοικητή", "ΔΕΣ Α 1077357 ΕΞ 10.5.2013, όπως δημοσιεύθηκε", "Δ.Ε.Δ.
  # 1126366 ΕΞ 2016/30.08.2016 (ΦΕΚ ..."). The same shape is also a private protocol ("ΔΕΔ 123456 ΕΞ
  # 2026 ΕΜΠ / 01-06-2026 έγγραφο"), so the evidence of publication is required right after it, in the
  # lookahead: its ΦΕΚ, its issuer's "Απόφαση του Διοικητή|Προϊσταμένου", or "όπως/η οποία
  # δημοσιεύθηκε". Without it the serial stays with the existing rules and the LLM passes.
  published_instruments:
    category: LEGAL_REF
    scope: any
    patterns:
      - '(?:δ\. ?οργ\. ?α|δεσ α\.?|δ\.? ?ε\.? ?δ\.?) [0-9]{6,8} εξ\.? (?:(?:19|2[0οo])[0-9οo]{2} ?/ ?)?[0-9οo]{1,2}[./-][0-9οo]{1,2}[./-](?:19|2[0οo])[0-9οo]{2}(?=,? (?:οπωσ|η οποια) δημοσιευθηκε| ?\(φεκ| αποφασ(?:η|ησ) του (?:διοικητη|προισταμενου))'
  # A percentage written in words, with its figure ("τριάντα τρία τοις εκατό (33%)"); closed number words only.
  percent_words:
    category: PERCENTAGE
    scope: any
    patterns:
      - '(?:(?:εικοσι|τριαντα|σαραντα|πενηντα|εξηντα|εβδομηντα|ογδοντα|ενενηντα) )?(?:ενα|δυο|τρια|τεσσερα|πεντε|εξι|επτα|εφτα|οκτω|οχτω|εννεα|εννια|δεκα|εντεκα|δωδεκα|εικοσι|τριαντα|σαραντα|πενηντα|εξηντα|εβδομηντα|ογδοντα|ενενηντα|εκατο) τοισ εκατο(?: \([0-9]{1,3}(?:,[0-9]{1,2})? ?%\))?'
  # Table column labels, only where they stand as a label (a header cell).
  table_labels:
    category: FIELD_LABEL
    scope: label
    patterns:
      - 'παρα ?στατικ(?:ο|ου|α)'
