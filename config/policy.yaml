policy:
  preserve_high_confidence_threshold: 0.8
  redact_high_confidence_threshold: 0.9
  redact_threshold: 0.7

  # HARD PRESERVE: authoritative, category-level, confidence-independent.
  # A PRESERVE span in one of these categories is a decision, not a
  # recommendation — it is withheld from the LLM pass-2 decision queue, so
  # neither pass can adjudicate it, and it outranks every ordinary span in the
  # resolver. Only a hard redact (below) can still take it.
  #
  # Categories NOT listed here still produce ordinary PRESERVE spans; those are
  # recommendations, they are sent to pass 2 for final adjudication, and no
  # amount of confidence turns one into a hard preserve. DATE in particular is
  # deliberately absent: a date can be a date of birth.
  hard_preserve_categories:
    - DOU
    - PUBLIC_SERVICE
    - LEGAL_REF
    - MONEY
    - TAX_YEAR
    - ARTICLE_REF
    - COURT_DECISION
    - DECISION_METADATA
    - PERCENTAGE
    - FISCAL_PERIOD
    # The structural label that introduces a value ("Α.Φ.Μ.", "ΑΤΑΚ", "οδός"),
    # and the generic party-role phrases ("η προσφεύγουσα εταιρεία", "ο νόμιμος
    # εκπρόσωπος"), a closed grammatical class.
    # Hard because it is mechanically certain: a token only enters this
    # category if it can never itself be, or begin, personal data. This is what
    # stops an over-wide span taking the label along with the value.
    - FIELD_LABEL
    # A date with POSITIVE evidence that it is procedural ("ημερομηνία
    # κατάθεσης", "εκδόθηκε στις"). Note that DATE stays out, for the
    # reason above: only this one has been shown not to be a date of birth.
    - PROCEDURAL_DATE
    # PUBLIC geography the rules have POSITIVELY identified, kept whole by the
    # new gold: a municipality WITH its administrative region after a residence
    # cue ("κατοίκου <municipality> Αττικής"), and the region after an
    # authority's place ("Δήμου <place> <region>"). Only those two detectors
    # emit it, and only for runs ending in an allowlists/regions.txt entry, so
    # it cannot shield a name. (The authority's place itself is a PUBLIC_SERVICE
    # preserve over the cue and the place, above.)
    #
    # The generic LOCALITY is deliberately NOT here, in either list: it is the
    # category for a place whose role the context does not settle (a district
    # or area name after "συνοικία"/"περιοχή" is an ordinary 0.85 proposal), and
    # whatever a model labels LOCALITY, so it stays ordinary evidence for pass
    # 2. A bare place after a residence cue ("κατοίκου Λαμίας") is the LLM's
    # decision (the prompts keep the locality); the rules give it only an
    # ordinary PRIVATE_ADDRESS proposal, which is the fallback when no usable
    # LLM decision exists, and no locality span at all.
    # (v2 lists LOCALITY as hard-REDACT instead: it blanks the toponym after an
    # authority cue, which the new gold keeps as part of the institution's name.)
    - PUBLIC_LOCALITY
    # The final official signatory's NAME, and nothing else of the signature
    # block: detectFinalSignatory emits it only after a signing title, on a
    # line of its own, with no private-party cue in the block. Hard so that
    # it is never redacted and never a pass-2 question (initial or
    # post-redaction); a hard redact (an identifier) still outranks it.
    - OFFICIAL_SIGNATORY

  # Hard redacts: if seen with confidence >= 0.9, no preserve can shield them
  hard_redact_categories:
    - AFM
    - AMKA
    - IBAN
    - EMAIL
    # Cadastral / property-register identifiers (ΑΤΑΚ, ΚΑΕΚ, Ο.Τ., Α.Χ.Κ.,
    # notice numbers). Safe to make hard only because every one of them is
    # cue-anchored and captures the value in group 1, so no PROPERTY_ID span can
    # ever cover the label that a hard preserve is protecting.
    - PROPERTY_ID

  preserve_email_domains:
    - aade.gr
    - gov.gr
