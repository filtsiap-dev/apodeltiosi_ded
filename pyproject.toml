[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ded-anonymizer"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "python-multipart",
    "uvicorn",
    "gunicorn",
    "uvicorn-worker",
    "openai",
    "lxml",
    "pyyaml",
    "python-stdnum",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "httpx"]

# config/ is runtime data (yaml + allowlists), not an importable package — restrict
# discovery to the anonymizer package (and its llm subpackage) only.
[tool.setuptools.packages.find]
include = ["anonymizer*"]
