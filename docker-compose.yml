# ded-anonymizer v2 — local/production compose.
# Start:  docker compose up --build -d
# Logs:   docker compose logs -f
# Test:   curl http://localhost:8000/healthz
services:
  anonymizer:
    build: .
    ports:
      - "8000:8000"
    # env_file injects the SAME .env you use locally as real container
    # environment variables (the file itself is never copied into the image).
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
